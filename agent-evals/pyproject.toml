[project]
name = "convoy-evals"
version = "0.1.0"
description = "Convoy eval harness: simulation sandbox, scenario format, graders, suite runner, reports, API."
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
convoy-evals = "convoy_evals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["convoy_evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
