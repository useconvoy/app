services:
  sandbox:
    build: .
    ports:
      - "8790:8790"
    environment:
      PORT: "8790"
      SANDBOX_RUNTIME_ROOT: /var/lib/convoy-sandbox
      SANDBOX_ADMIN_TOKEN: ${SANDBOX_ADMIN_TOKEN:-}
    volumes:
      - sandbox-state:/var/lib/convoy-sandbox
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  sandbox-state:
