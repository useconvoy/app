# Rejecting the initial plan records the reason and pauses the run for human
# follow-up before any turn executes; a land then wraps up with nothing done.
name: reject-plan
run:
  budget_cap_usd: "10"
  policy:
    require_plan_approval: true
turns: []
actions:
  - {after_event: plan_created, signal: reject, plan_version: 1,
     reason: "wrong direction; rescope to the EU market first"}
  - {after_event: paused, signal: land}
expect:
  final_status: completed
  land_status: landed_partial
  events:
    - run_started
    - plan_created
    - revision_rejected
    - paused
    - landing_started
    - run_completed
  turn_calls: 0
