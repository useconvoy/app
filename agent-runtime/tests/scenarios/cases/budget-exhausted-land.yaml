# on_budget_exhausted: land — the run wraps itself up without a human,
# landing with whatever completed inside the cap.
name: budget-exhausted-land
run:
  budget_cap_usd: "1.00"
  policy:
    on_budget_exhausted: land
turns:
  - {cost_usd: "0.85", outcome: step_done}
  - {cost_usd: "0.20", outcome: continue}
expect:
  final_status: completed
  land_status: landed_partial
  events:
    - run_started
    - plan_created
    - step_started
    - step_done
    - budget_warning
    - step_started
    - budget_exhausted
    - landing_started
    - run_completed
  budget_spent: "1.05"
  turn_calls: 2
