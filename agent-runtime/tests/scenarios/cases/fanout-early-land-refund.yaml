# Reservation refund on an early, cheap child landing: the cap is tight
# enough (4 USD against two 2 USD slices) that the second child's full slice
# only fits because the first child's landing refunded its unspent money
# before the second spawn carved its reservation. Committed spend
# (spent + reserved) stays under the cap at every boundary.
name: fanout-early-land-refund
run:
  budget_cap_usd: "4"
  max_children: 2
  fanout:
    size: 2
    budget_slice: "2.00"
  policy:
    max_parallel: 1
child_turns:
  fan-1:
    - {cost_usd: "0.10", outcome: step_done}   # lands early, well under its slice
  fan-2:
    - {cost_usd: "1.50", outcome: step_done}
expect:
  final_status: completed
  land_status: completed
  events:
    - run_started
    - plan_created
    - step_started        # step-1 (self)
    - step_done
    - compaction_applied
    - step_started        # fan-1
    - child_spawned       # reserved 2.00 of 4.00
    - run_started
    - step_started
    - step_done
    - run_completed
    - child_landed        # spent +0.10, refund 1.90 back to available
    - step_done
    - step_started        # fan-2 — its full 2.00 slice fits again
    - child_spawned
    - run_started
    - step_started
    - step_done
    - run_completed
    - child_landed
    - step_done
    - step_started        # join
    - step_done
    - compaction_applied
    - landing_started
    - run_completed
  turn_calls: 4
  budget_spent: "1.6002"
  budget_reserved: "0"
  child_refunds:
    fan-1: "1.90"
    fan-2: "0.50"
