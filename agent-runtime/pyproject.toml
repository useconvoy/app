[project]
name = "convoy-runtime"
version = "0.1.0"
description = "Convoy agent runtime - durable multi-day agent runs on Temporal"
requires-python = ">=3.12"
dependencies = [
    "convoy-core",
    "pydantic>=2.11",
    "temporalio>=1.15",
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "boto3>=1.39",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "cryptography>=45",
    "httpx>=0.28",
    "anyio>=4.9",
]

[tool.uv.sources]
convoy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convoy_runtime"]
