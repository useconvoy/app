[project]
name = "convoy-agent"
version = "0.1.0"
description = "Convoy device agent for Jetson Orin Nano (stdlib only, outbound HTTPS)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
coordinator = ["convoy-contracts"]
local-host = ["psutil==7.2.2"]

[tool.uv.sources]
convoy-contracts = { workspace = true }

[project.scripts]
convoy-agent = "convoy_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convoy_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
