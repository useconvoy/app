[project]
name = "convoy-mvp"
version = "0.1.0"
description = "Convoy: fleet model releases, evals, rollouts and telemetry for Jetson Orin Nano"
requires-python = ">=3.10"

[tool.uv.workspace]
members = ["server", "agent"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008", "UP007", "UP006", "UP035", "UP045"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "playwright>=1.47",
]
