[project]
name = "convoy-worker"
version = "0.1.0"
description = "Independent authenticated Convoy action-policy inference worker"
requires-python = ">=3.11"
dependencies = ["convoy-contracts[signing]", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
convoy-worker = "convoy_worker.cli:main"

[tool.uv.sources]
convoy-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convoy_worker"]
