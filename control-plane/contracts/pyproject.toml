[project]
name = "convoy-contracts"
version = "0.1.0"
description = "Versioned, dependency-free Convoy execution contracts"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
signing = ["PyJWT[crypto]==2.15.0", "cryptography==50.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convoy_contracts"]
