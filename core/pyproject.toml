[project]
name = "convoy-core"
version = "0.1.0"
description = "Convoy shared datatypes - owned by no service"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convoy_core"]
