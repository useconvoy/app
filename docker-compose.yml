# Convoy Labs — single-host deployment (Phase 0 in docs/deployment.md).
#
#   docker compose up -d --build
#
# Then put TLS in front (platform-provided, or a Caddy/nginx reverse proxy
# on the same host). Reseed the demo workspace with:
#   docker compose down && docker volume rm app_convoy-data && docker compose up -d

services:
  convoy:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - convoy-data:/data
    environment:
      # Shared-credential gate for the hosted demo (user:password).
      # REQUIRED for anything internet-facing — there is no other auth yet.
      CONVOY_BASIC_AUTH: ${CONVOY_BASIC_AUTH:?set CONVOY_BASIC_AUTH=user:password}
      # Optional: drive agents with the live model instead of demo mode.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CONVOY_LIVE_MODEL: ${CONVOY_LIVE_MODEL:-0}
      CONVOY_MODEL: ${CONVOY_MODEL:-claude-opus-5}

volumes:
  convoy-data:
