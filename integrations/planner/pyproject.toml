[project]
name = "convoy-planner"
version = "0.1.0"
description = "Optional fixed-task planner adapter for the owned Convoy llama.cpp gateway"
requires-python = ">=3.10"
dependencies = ["convoy-contracts[signing]", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
owned = ["convoy-agent[local-host]"]

[project.scripts]
convoy-planner = "convoy_planner.cli:main"

[tool.uv.sources]
convoy-contracts = { path = "../../control-plane/contracts", editable = true }
convoy-agent = { path = "../../control-plane/agent", editable = true }

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27", "ruff>=0.12,<0.13"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convoy_planner"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
