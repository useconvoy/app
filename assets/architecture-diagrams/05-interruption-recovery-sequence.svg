<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="900" viewBox="0 0 1450 900">
  <title>Interruption recovery and reconciliation</title>
  <desc>A provider task can disappear without losing the logical Agent</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#132238" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24364E"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79A7FF"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #132238; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #617083; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #617083; }
      .tiny { font-size: 12px; fill: #617083; }
      .lane { font-size: 15px; font-weight: 650; }
      .seq { font-size: 13px; }
    </style>
  </defs>
  <rect width="1450" height="900" fill="#F7F6F2"/>
  <text x="48" y="50" class="title">Interruption recovery and reconciliation</text>
  <text x="48" y="78" class="subtitle">A provider task can disappear without losing the logical Agent</text><rect x="62.5" y="110" width="155" height="54" rx="12" fill="#DDF3EA" stroke="#24364E" stroke-width="2"  /><text x="140" y="143" text-anchor="middle" class="lane">Agent Episode</text>
  <path d="M 140 164 L 140 840" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="302.5" y="110" width="155" height="54" rx="12" fill="#FBE1E3" stroke="#24364E" stroke-width="2"  /><text x="380" y="143" text-anchor="middle" class="lane">S3</text>
  <path d="M 380 164 L 380 840" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="552.5" y="110" width="155" height="54" rx="12" fill="#DDE9FF" stroke="#24364E" stroke-width="2"  /><text x="630" y="143" text-anchor="middle" class="lane">EventBridge</text>
  <path d="M 630 164 L 630 840" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="802.5" y="110" width="155" height="54" rx="12" fill="#FFF0C7" stroke="#24364E" stroke-width="2"  /><text x="880" y="143" text-anchor="middle" class="lane">Reconciler</text>
  <path d="M 880 164 L 880 840" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1042.5" y="110" width="155" height="54" rx="12" fill="#ECE5FF" stroke="#24364E" stroke-width="2"  /><text x="1120" y="143" text-anchor="middle" class="lane">Temporal</text>
  <path d="M 1120 164 L 1120 840" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1262.5" y="110" width="155" height="54" rx="12" fill="#DDF3EA" stroke="#24364E" stroke-width="2"  /><text x="1340" y="143" text-anchor="middle" class="lane">Replacement</text>
  <path d="M 1340 164 L 1340 840" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><path d="M 148 220 L 372 220" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="260" y="212" text-anchor="middle" class="seq">periodic checkpoint</text><path d="M 622 300 L 148 300" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="385" y="292" text-anchor="middle" class="seq">Spot interruption notice</text><path d="M 148 380 L 372 380" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="260" y="372" text-anchor="middle" class="seq">final checkpoint</text><path d="M 94 428 L 186 472 M 186 428 L 94 472" stroke="#DE7D86" stroke-width="5" stroke-linecap="round"/>
  <text x="140" y="502" text-anchor="middle" class="small">task exits</text><path d="M 638 540 L 872 540" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="755" y="532" text-anchor="middle" class="seq">task STOPPED event</text><path d="M 888 615 L 1112 615" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="1000" y="607" text-anchor="middle" class="seq">provider gone; retry Agent</text><path d="M 1128 690 L 1332 690" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="1230" y="682" text-anchor="middle" class="seq">launch new episode</text><path d="M 1332 765 L 388 765" fill="none" stroke="#24364E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="860" y="757" text-anchor="middle" class="seq">load latest valid checkpoint</text><text x="725" y="820" text-anchor="middle" class="subtitle">Same agent_id • new episode_id • no duplicate terminal state</text></svg>