<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <title>One authority per kind of state</title>
  <desc>Avoid split-brain orchestration by separating product, workflow, artifact, and projection data</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#132238" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24364E"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79A7FF"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #132238; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #617083; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #617083; }
      .tiny { font-size: 12px; fill: #617083; }
      .lane { font-size: 15px; font-weight: 650; }
      .seq { font-size: 13px; }
    </style>
  </defs>
  <rect width="1400" height="820" fill="#F7F6F2"/>
  <text x="48" y="50" class="title">One authority per kind of state</text>
  <text x="48" y="78" class="subtitle">Avoid split-brain orchestration by separating product, workflow, artifact, and projection data</text><rect x="530" y="110" width="340" height="76" rx="16" fill="#DDE9FF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="700" y="154" text-anchor="middle" class="label">Convoy Mission</text><text x="700" y="173" text-anchor="middle" class="tiny">stable mission_id</text><rect x="90" y="330" width="260" height="120" rx="16" fill="#DDE9FF" stroke="#24364E" stroke-width="2" filter="url(#shadow)"/>
    <text x="220" y="364" text-anchor="middle" class="label">Postgres</text><text x="220" y="393" text-anchor="middle" class="tiny">Product configuration</text><text x="220" y="411" text-anchor="middle" class="tiny">Governance records</text><text x="220" y="429" text-anchor="middle" class="tiny">Canonical Mission record</text><path d="M 700 186 L 220 330" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="405" y="330" width="260" height="120" rx="16" fill="#ECE5FF" stroke="#24364E" stroke-width="2" filter="url(#shadow)"/>
    <text x="535" y="364" text-anchor="middle" class="label">Temporal</text><text x="535" y="393" text-anchor="middle" class="tiny">Workflow progress</text><text x="535" y="411" text-anchor="middle" class="tiny">Timers + signals</text><text x="535" y="429" text-anchor="middle" class="tiny">Parent / child state</text><path d="M 700 186 L 535 330" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="720" y="330" width="260" height="120" rx="16" fill="#FBE1E3" stroke="#24364E" stroke-width="2" filter="url(#shadow)"/>
    <text x="850" y="364" text-anchor="middle" class="label">S3</text><text x="850" y="393" text-anchor="middle" class="tiny">Inputs + artifacts</text><text x="850" y="411" text-anchor="middle" class="tiny">Checkpoints</text><text x="850" y="429" text-anchor="middle" class="tiny">Immutable result bundle</text><path d="M 700 186 L 850 330" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="1035" y="330" width="260" height="120" rx="16" fill="#DDF3EA" stroke="#24364E" stroke-width="2" filter="url(#shadow)"/>
    <text x="1165" y="364" text-anchor="middle" class="label">DynamoDB</text><text x="1165" y="393" text-anchor="middle" class="tiny">Live agent tree</text><text x="1165" y="411" text-anchor="middle" class="tiny">Recent events</text><text x="1165" y="429" text-anchor="middle" class="tiny">Rebuildable projection</text><path d="M 700 186 L 1165 330" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="896.5" y="238" width="72" height="19" rx="9" fill="#F7F6F2"/>
    <text x="932.5" y="252" text-anchor="middle" class="tiny">project</text><rect x="180" y="565" width="1040" height="160" rx="20" fill="none" stroke="#24364E" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="198" y="551" width="198" height="28" rx="14" fill="#F7F6F2"/>
  <text x="211" y="570" class="lane">CONSISTENCY + RECOVERY</text><rect x="235" y="610" width="210" height="30" rx="15" fill="#FFFFFF" stroke="#24364E" stroke-width="1.5"/>
  <text x="340" y="630" text-anchor="middle" class="small">idempotency keys</text><rect x="475" y="610" width="210" height="30" rx="15" fill="#FFFFFF" stroke="#24364E" stroke-width="1.5"/>
  <text x="580" y="630" text-anchor="middle" class="small">conditional writes</text><rect x="715" y="610" width="210" height="30" rx="15" fill="#FFFFFF" stroke="#24364E" stroke-width="1.5"/>
  <text x="820" y="630" text-anchor="middle" class="small">sequence-aware events</text><rect x="955" y="610" width="210" height="30" rx="15" fill="#FFFFFF" stroke="#24364E" stroke-width="1.5"/>
  <text x="1060" y="630" text-anchor="middle" class="small">reconciliation</text><text x="700" y="690" text-anchor="middle" class="label">DynamoDB can be rebuilt. Temporal is never reconstructed from UI state.</text>
  <text x="700" y="770" text-anchor="middle" class="subtitle">Pointers cross stores; large payloads do not.</text></svg>