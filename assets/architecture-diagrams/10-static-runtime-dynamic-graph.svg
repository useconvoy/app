<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="930" viewBox="0 0 1450 930">
  <title>Static durable runtime, dynamic execution graph</title>
  <desc>Compilation fixes the mission envelope; agents continuously discover the plan</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#132238" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24364E"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79A7FF"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #132238; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #617083; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #617083; }
      .tiny { font-size: 12px; fill: #617083; }
      .lane { font-size: 15px; font-weight: 650; }
      .seq { font-size: 13px; }
    </style>
  </defs>
  <rect width="1450" height="930" fill="#F7F6F2"/>
  <text x="48" y="50" class="title">Static durable runtime, dynamic execution graph</text>
  <text x="48" y="78" class="subtitle">Compilation fixes the mission envelope; agents continuously discover the plan</text><rect x="45" y="120" width="360" height="690" rx="20" fill="#ECE5FF" stroke="#24364E" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="63" y="106" width="252" height="28" rx="14" fill="#F7F6F2"/>
  <text x="76" y="125" class="lane">PREDEPLOYED TEMPORAL RUNTIME</text><rect x="90" y="170" width="270" height="78" rx="16" fill="#FFFFFF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="225" y="215" text-anchor="middle" class="label">MissionWorkflow</text><text x="225" y="235" text-anchor="middle" class="tiny">budget • deadline • admission</text><rect x="90" y="300" width="270" height="78" rx="16" fill="#FFFFFF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="225" y="345" text-anchor="middle" class="label">AgentWorkflow</text><text x="225" y="365" text-anchor="middle" class="tiny">checkpoint • children • mailbox</text><rect x="90" y="430" width="270" height="92" rx="16" fill="#FFFFFF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="225" y="471.5" text-anchor="middle" class="label">Deterministic</text><text x="225" y="492.5" text-anchor="middle" class="label">intent interpreter</text><text x="225" y="509" text-anchor="middle" class="tiny">versioned orchestration code</text><rect x="90" y="590" width="270" height="120" rx="16" fill="#DDE9FF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="225" y="645.5" text-anchor="middle" class="label">MissionSpec</text><text x="225" y="666.5" text-anchor="middle" class="label">execution envelope</text><text x="225" y="697" text-anchor="middle" class="tiny">objective • policy • limits • refs</text><path d="M 225 590 L 225 522" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="183.2" y="536" width="83.6" height="19" rx="9" fill="#F7F6F2"/>
    <text x="225" y="550" text-anchor="middle" class="tiny">starts with</text><rect x="455" y="120" width="470" height="690" rx="20" fill="#DDF3EA" stroke="#24364E" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="473" y="106" width="234" height="28" rx="14" fill="#F7F6F2"/>
  <text x="486" y="125" class="lane">ROLLING-HORIZON AGENT LOOP</text><rect x="520" y="175" width="340" height="84" rx="16" fill="#FFFFFF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="690" y="212.5" text-anchor="middle" class="label">Launch bounded</text><text x="690" y="233.5" text-anchor="middle" class="label">Agent Episode</text><text x="690" y="246" text-anchor="middle" class="tiny">model + tools run in an Activity</text><rect x="520" y="325" width="340" height="98" rx="16" fill="#FFF0C7" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="690" y="369.5" text-anchor="middle" class="label">Return typed</text><text x="690" y="390.5" text-anchor="middle" class="label">next intent</text><text x="690" y="410" text-anchor="middle" class="tiny">result is recorded in history</text><rect x="505" y="475" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#24364E" stroke-width="1.5"/>
  <text x="590" y="495" text-anchor="middle" class="small">use_tool</text><rect x="700" y="475" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#24364E" stroke-width="1.5"/>
  <text x="785" y="495" text-anchor="middle" class="small">spawn_agents</text><rect x="505" y="535" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#24364E" stroke-width="1.5"/>
  <text x="590" y="555" text-anchor="middle" class="small">wait</text><rect x="700" y="535" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#24364E" stroke-width="1.5"/>
  <text x="785" y="555" text-anchor="middle" class="small">replan</text><rect x="505" y="595" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#24364E" stroke-width="1.5"/>
  <text x="590" y="615" text-anchor="middle" class="small">request_approval</text><rect x="700" y="595" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#24364E" stroke-width="1.5"/>
  <text x="785" y="615" text-anchor="middle" class="small">complete</text><path d="M 690 259 L 690 325" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="636.8" y="272" width="106.39999999999999" height="19" rx="9" fill="#F7F6F2"/>
    <text x="690" y="286" text-anchor="middle" class="tiny">episode result</text><path d="M 520 374 L 475 374 L 475 217 L 520 217" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M 405 338 L 455 338 L 455 217 L 520 217" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="463" y="208" class="tiny">schedule</text><rect x="975" y="120" width="430" height="690" rx="20" fill="#DDE9FF" stroke="#24364E" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="993" y="106" width="198" height="28" rx="14" fill="#F7F6F2"/>
  <text x="1006" y="125" class="lane">EMERGENT MISSION GRAPH</text><rect x="1090" y="170" width="200" height="68" rx="16" fill="#ECE5FF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="1190" y="210" text-anchor="middle" class="label">Root Agent</text><text x="1190" y="225" text-anchor="middle" class="tiny">known at start</text><rect x="1005" y="340" width="170" height="68" rx="16" fill="#DDE9FF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="1090" y="380" text-anchor="middle" class="label">Research Agent</text><text x="1090" y="395" text-anchor="middle" class="tiny">created at runtime</text><rect x="1205" y="340" width="170" height="68" rx="16" fill="#DDF3EA" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="1290" y="380" text-anchor="middle" class="label">Ops Agent</text><text x="1290" y="395" text-anchor="middle" class="tiny">created at runtime</text><rect x="1005" y="530" width="170" height="68" rx="16" fill="#FFF0C7" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="1090" y="570" text-anchor="middle" class="label">Evidence Agent</text><text x="1090" y="585" text-anchor="middle" class="tiny">created later</text><rect x="1205" y="530" width="170" height="68" rx="16" fill="#FBE1E3" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="1290" y="570" text-anchor="middle" class="label">Synthesis Agent</text><text x="1290" y="585" text-anchor="middle" class="tiny">created later</text><path d="M 1190 238 L 1090 340" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 1190 238 L 1290 340" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 1090 408 L 1090 530" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 1290 408 L 1290 530" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 860 374 L 950 374 L 950 204 L 1090 204" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="958" y="195" class="tiny">admitted spawn</text><path d="M 1010 665 C 1080 620, 1260 620, 1370 680" fill="none" stroke="#79A7FF" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="1190" y="715" text-anchor="middle" class="label">Not known when the mission starts</text>
  <text x="1190" y="744" text-anchor="middle" class="small">The graph materializes from recorded episode decisions.</text><rect x="130" y="850" width="1190" height="50" rx="18" fill="#FBE1E3" stroke="#DE7D86" stroke-width="2"/>
  <text x="725" y="882" text-anchor="middle" class="label">Plans are mutable data. Agents never generate or deploy new Temporal workflow code mid-mission.</text></svg>