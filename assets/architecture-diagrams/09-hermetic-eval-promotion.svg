<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <title>Hermetic evaluation and certified promotion</title>
  <desc>The exact behavior-determining release tuple must pass before Production</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#132238" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24364E"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79A7FF"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #132238; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #617083; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #617083; }
      .tiny { font-size: 12px; fill: #617083; }
      .lane { font-size: 15px; font-weight: 650; }
      .seq { font-size: 13px; }
    </style>
  </defs>
  <rect width="1400" height="850" fill="#F7F6F2"/>
  <text x="48" y="50" class="title">Hermetic evaluation and certified promotion</text>
  <text x="48" y="78" class="subtitle">The exact behavior-determining release tuple must pass before Production</text><rect x="75" y="125" width="250" height="76" rx="16" fill="#DDE9FF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="200" y="169" text-anchor="middle" class="label">Draft Agent Version</text><text x="200" y="188" text-anchor="middle" class="tiny">prompt • model • grants</text><rect x="415" y="125" width="250" height="76" rx="16" fill="#ECE5FF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="540" y="169" text-anchor="middle" class="label">Pinned Deployment</text><text x="540" y="188" text-anchor="middle" class="tiny">policy • tools • runtime</text><rect x="755" y="125" width="250" height="76" rx="16" fill="#DDF3EA" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="880" y="169" text-anchor="middle" class="label">Hermetic World</text><text x="880" y="188" text-anchor="middle" class="tiny">isolated seeded state</text><rect x="1095" y="125" width="230" height="76" rx="16" fill="#DDF3EA" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="1210" y="169" text-anchor="middle" class="label">Parallel Eval Runs</text><text x="1210" y="188" text-anchor="middle" class="tiny">scripted approvals</text><path d="M 325 163 L 415 163" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 665 163 L 755 163" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 1005 163 L 1095 163" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="135" y="315" width="1130" height="180" rx="20" fill="none" stroke="#9B82E6" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="153" y="301" width="135" height="28" rx="14" fill="#F7F6F2"/>
  <text x="166" y="320" class="lane">LAYERED GRADERS</text><rect x="180" y="360" width="220" height="78" rx="16" fill="#DDE9FF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="290" y="394.5" text-anchor="middle" class="label">End-state</text><text x="290" y="415.5" text-anchor="middle" class="label">assertions</text><text x="290" y="425" text-anchor="middle" class="tiny">deterministic</text><rect x="450" y="360" width="220" height="78" rx="16" fill="#FFF0C7" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="560" y="394.5" text-anchor="middle" class="label">Trajectory</text><text x="560" y="415.5" text-anchor="middle" class="label">assertions</text><text x="560" y="425" text-anchor="middle" class="tiny">tools + arguments</text><rect x="720" y="360" width="220" height="78" rx="16" fill="#ECE5FF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="830" y="394.5" text-anchor="middle" class="label">Pinned LLM</text><text x="830" y="415.5" text-anchor="middle" class="label">rubric</text><text x="830" y="425" text-anchor="middle" class="tiny">fuzzy quality</text><rect x="990" y="360" width="220" height="78" rx="16" fill="#FBE1E3" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="1100" y="394.5" text-anchor="middle" class="label">Human</text><text x="1100" y="415.5" text-anchor="middle" class="label">review</text><text x="1100" y="425" text-anchor="middle" class="tiny">uncertain cases</text><path d="M 1210 201 L 1210 285 L 700 285 L 700 315" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="708" y="276" class="tiny">evidence</text><rect x="185" y="610" width="310" height="94" rx="16" fill="#DDF3EA" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="340" y="652.5" text-anchor="middle" class="label">Certified Release</text><text x="340" y="673.5" text-anchor="middle" class="label">Tuple</text><text x="340" y="691" text-anchor="middle" class="tiny">all behavior inputs hashed</text><rect x="545" y="610" width="310" height="94" rx="16" fill="#FFF0C7" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="700" y="652.5" text-anchor="middle" class="label">Promotion Gate</text><text x="700" y="673.5" text-anchor="middle" class="label">exact tuple match</text><text x="700" y="691" text-anchor="middle" class="tiny">no stale certification</text><rect x="905" y="610" width="310" height="94" rx="16" fill="#DDE9FF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="1060" y="652.5" text-anchor="middle" class="label">Production</text><text x="1060" y="673.5" text-anchor="middle" class="label">Deployment</text><text x="1060" y="691" text-anchor="middle" class="tiny">canary • rollback</text><path d="M 700 495 L 700 560 L 340 560 L 340 610" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="348" y="551" class="tiny">pass</text><path d="M 495 657 L 545 657" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 855 657 L 905 657" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 700 495 L 700 530 L 200 530 L 200 201" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="208" y="521" class="tiny">fail → revise</text><text x="700" y="785" text-anchor="middle" class="subtitle">Any change to model, prompt, tools, policy, evals, gateway, or runtime invalidates certification.</text></svg>