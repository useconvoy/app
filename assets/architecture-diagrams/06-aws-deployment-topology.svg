<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="930" viewBox="0 0 1450 930">
  <title>AWS deployment topology</title>
  <desc>Private runners, explicit gateways, managed durable orchestration</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#132238" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24364E"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79A7FF"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #132238; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #617083; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #617083; }
      .tiny { font-size: 12px; fill: #617083; }
      .lane { font-size: 15px; font-weight: 650; }
      .seq { font-size: 13px; }
    </style>
  </defs>
  <rect width="1450" height="930" fill="#F7F6F2"/>
  <text x="48" y="50" class="title">AWS deployment topology</text>
  <text x="48" y="78" class="subtitle">Private runners, explicit gateways, managed durable orchestration</text><rect x="50" y="130" width="220" height="58" rx="16" fill="#DDE9FF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="160" y="165" text-anchor="middle" class="label">Users + Webhooks</text><rect x="1180" y="130" width="220" height="58" rx="16" fill="#ECE5FF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="1290" y="165" text-anchor="middle" class="label">Temporal Cloud</text><text x="1290" y="175" text-anchor="middle" class="tiny">outside VPC</text><rect x="45" y="235" width="1360" height="630" rx="20" fill="none" stroke="#79A7FF" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="63" y="221" width="378" height="28" rx="14" fill="#F7F6F2"/>
  <text x="76" y="240" class="lane">AWS ACCOUNT • us-west-2 • VPC ACROSS 2 AZs</text><rect x="80" y="285" width="1290" height="95" rx="20" fill="#DDE9FF" stroke="#24364E" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="98" y="271" width="126" height="28" rx="14" fill="#F7F6F2"/>
