    <text x="267.5" y="231" text-anchor="middle" class="tiny">TLS</text><path d="M 160 188 L 660 315" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="360.6" y="231.5" width="98.8" height="19" rx="9" fill="#F7F6F2"/>
