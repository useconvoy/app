  <rect x="98" y="611" width="225" height="28" rx="14" fill="#F7F6F2"/>
  <text x="111" y="630" class="lane">RESTRICTED RUNNER SUBNETS</text><rect x="120" y="670" width="220" height="70" rx="16" fill="#FFFFFF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="230" y="711" text-anchor="middle" class="label">Root Episode</text><text x="230" y="727" text-anchor="middle" class="tiny">no public IP</text><rect x="390" y="670" width="220" height="70" rx="16" fill="#FFFFFF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="500" y="711" text-anchor="middle" class="label">Child Episodes</text><text x="500" y="727" text-anchor="middle" class="tiny">Fargate / Spot</text><rect x="660" y="670" width="210" height="70" rx="16" fill="#FFFFFF" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="765" y="711" text-anchor="middle" class="label">Hermetic World</text><text x="765" y="727" text-anchor="middle" class="tiny">eval only</text><path d="M 568 538 L 568 605 L 230 605 L 230 670" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="238" y="596" class="tiny">ECS RunTask</text><path d="M 588 605 L 500 605 L 500 670" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M 610 705 L 770 515" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="654" y="590" width="72" height="19" rx="9" fill="#F7F6F2"/>
    <text x="690" y="604" text-anchor="middle" class="tiny">all tools</text><path d="M 340 705 L 770 515" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="960" y="625" width="410" height="155" rx="20" fill="#FBE1E3" stroke="#24364E" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="978" y="611" width="189" height="28" rx="14" fill="#F7F6F2"/>
  <text x="991" y="630" class="lane">AWS PRIVATE ENDPOINTS</text><rect x="990" y="665" width="150" height="50" rx="16" fill="#FFFFFF" stroke="#24364E" stroke-width="2"  /><text x="1065" y="696" text-anchor="middle" class="label">S3</text><rect x="1170" y="665" width="150" height="50" rx="16" fill="#FFFFFF" stroke="#24364E" stroke-width="2"  /><text x="1245" y="696" text-anchor="middle" class="label">DynamoDB</text><rect x="990" y="725" width="150" height="38" rx="16" fill="#FFFFFF" stroke="#24364E" stroke-width="2"  /><text x="1065" y="750" text-anchor="middle" class="small">ECR + Logs</text><rect x="1170" y="725" width="150" height="38" rx="16" fill="#FFFFFF" stroke="#24364E" stroke-width="2"  /><text x="1245" y="750" text-anchor="middle" class="small">Secrets + KMS</text><path d="M 870 705 L 990 690" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 870 720 L 1170 690" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round"  marker-end="url(#arrow)"/><rect x="1070" y="835" width="280" height="54" rx="16" fill="#FFF0C7" stroke="#24364E" stroke-width="2"  filter="url(#shadow)"/><text x="1210" y="857.5" text-anchor="middle" class="label">Enterprise Systems +</text><text x="1210" y="878.5" text-anchor="middle" class="label">Models</text><path d="M 895 538 L 895 810 L 1210 810 L 1210 835" fill="none" stroke="#24364E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="1218" y="801" class="tiny">approved egress</text><text x="720" y="905" text-anchor="middle" class="small">Runner security groups: no inbound rules • egress only to gateway and approved AWS endpoints</text></svg>