<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="920" viewBox="0 0 1450 920">
  <title>Weeks-long work without weeks-long compute</title>
  <desc>An AgentWorkflow persists while bounded Agent Episodes come and go</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#132238" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24364E"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79A7FF"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #132238; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #617083; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #617083; }
      .tiny { font-size: 12px; fill: #617083; }
      .lane { font-size: 15px; font-weight: 650; }
      .seq { font-size: 13px; }
    </style>
  </defs>
  <rect width="1450" height="920" fill="#F7F6F2"/>
  <text x="48" y="50" class="title">Weeks-long work without weeks-long compute</text>
  <text x="48" y="78" class="subtitle">An AgentWorkflow persists while bounded Agent Episodes come and go</text><rect x="67.5" y="110" width="185" height="54" rx="12" fill="#ECE5FF" stroke="#24364E" stroke-width="2"  /><text x="160" y="143" text-anchor="middle" class="lane">AgentWorkflow</text>
  <path d="M 160 164 L 160 865" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="347.5" y="110" width="185" height="54" rx="12" fill="#DDF3EA" stroke="#24364E" stroke-width="2"  /><text x="440" y="143" text-anchor="middle" class="lane">Fargate Episode A</text>
  <path d="M 440 164 L 440 865" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="637.5" y="110" width="185" height="54" rx="12" fill="#FBE1E3" stroke="#24364E" stroke-width="2"  /><text x="730" y="143" text-anchor="middle" class="lane">S3 Checkpoint</text>
  <path d="M 730 164 L 730 865" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="917.5" y="110" width="185" height="54" rx="12" fill="#DDE9FF" stroke="#24364E" stroke-width="2"  /><text x="1010" y="143" text-anchor="middle" class="lane">Timer / Webhook</text>
  <path d="M 1010 164 L 1010 865" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1197.5" y="110" width="185" height="54" rx="12" fill="#DDF3EA" stroke="#24364E" stroke-width="2"  /><text x="1290" y="143" text-anchor="middle" class="lane">Fargate Episode B</text>
  <path d="M 1290 164 L 1290 865" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><path d="M 168 220 L 432 220" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="300" y="212" text-anchor="middle" class="seq">launch active work</text><path d="M 448 305 L 722 305" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="585" y="297" text-anchor="middle" class="seq">persist plan + artifacts</text><path d="M 432 390 L 168 390" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="300" y="382" text-anchor="middle" class="seq">waiting for external event</text><rect x="320" y="445" width="250" height="44" rx="12" fill="#FBE1E3" stroke="#DE7D86" stroke-width="2"/>
  <text x="445" y="473" text-anchor="middle" class="lane">Episode A exits</text><path d="M 168 535 L 1002 535" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="585" y="527" text-anchor="middle" class="seq">register durable timer / signal</text><rect x="85" y="571" width="1040" height="82" rx="18" fill="#ECE5FF" stroke="#9B82E6" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="605" y="604" text-anchor="middle" class="label">Days or weeks pass</text>
  <text x="605" y="630" text-anchor="middle" class="small">Temporal state persists • zero agent tasks running • no idle compute spend</text><path d="M 1002 700 L 168 700" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="585" y="692" text-anchor="middle" class="seq">webhook or timer fires</text><path d="M 168 770 L 1282 770" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="725" y="762" text-anchor="middle" class="seq">launch from checkpoint</text><path d="M 1282 840 L 738 840" fill="none" stroke="#24364E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="1010" y="832" text-anchor="middle" class="seq">load + continue</text></svg>