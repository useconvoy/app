<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
  <title>Mission lifecycle — from request to evaluated result</title>
  <desc>UML-style sequence: durable control, disposable compute</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#132238" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24364E"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79A7FF"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #132238; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #617083; }
      .label { font-size: 17px; font-weight: 650; }
      .small { font-size: 14px; fill: #617083; }
      .tiny { font-size: 12px; fill: #617083; }
      .lane { font-size: 15px; font-weight: 650; }
      .seq { font-size: 13px; }
    </style>
  </defs>
  <rect width="1500" height="1040" fill="#F7F6F2"/>
  <text x="48" y="50" class="title">Mission lifecycle — from request to evaluated result</text>
  <text x="48" y="78" class="subtitle">UML-style sequence: durable control, disposable compute</text><rect x="30" y="105" width="150" height="54" rx="12" fill="#DDE9FF" stroke="#24364E" stroke-width="2"  /><text x="105" y="138" text-anchor="middle" class="lane">User / Trigger</text>
  <path d="M 105 159 L 105 970" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="225" y="105" width="150" height="54" rx="12" fill="#DDE9FF" stroke="#24364E" stroke-width="2"  /><text x="300" y="138" text-anchor="middle" class="lane">Control Plane</text>
  <path d="M 300 159 L 300 970" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="430" y="105" width="150" height="54" rx="12" fill="#ECE5FF" stroke="#24364E" stroke-width="2"  /><text x="505" y="138" text-anchor="middle" class="lane">Temporal</text>
  <path d="M 505 159 L 505 970" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="635" y="105" width="150" height="54" rx="12" fill="#ECE5FF" stroke="#24364E" stroke-width="2"  /><text x="710" y="138" text-anchor="middle" class="lane">Coordinator</text>
  <path d="M 710 159 L 710 970" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="855" y="105" width="150" height="54" rx="12" fill="#DDF3EA" stroke="#24364E" stroke-width="2"  /><text x="930" y="138" text-anchor="middle" class="lane">Fargate Agent</text>
  <path d="M 930 159 L 930 970" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1065" y="105" width="150" height="54" rx="12" fill="#FFF0C7" stroke="#24364E" stroke-width="2"  /><text x="1140" y="138" text-anchor="middle" class="lane">Gateway</text>
  <path d="M 1140 159 L 1140 970" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1275" y="105" width="150" height="54" rx="12" fill="#FBE1E3" stroke="#24364E" stroke-width="2"  /><text x="1350" y="138" text-anchor="middle" class="lane">S3 + Projection</text>
  <path d="M 1350 159 L 1350 970" stroke="#617083" stroke-width="1.5" stroke-dasharray="6 6"/><path d="M 113 205 L 292 205" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="202.5" y="197" text-anchor="middle" class="seq">1  create mission</text><path d="M 308 270 L 1342 270" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="825" y="262" text-anchor="middle" class="seq">2  persist spec + inputs</text><path d="M 308 335 L 497 335" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="402.5" y="327" text-anchor="middle" class="seq">3  start MissionWorkflow</text><path d="M 513 400 L 702 400" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="607.5" y="392" text-anchor="middle" class="seq">4  plan envelope</text><path d="M 718 465 L 922 465" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="820" y="457" text-anchor="middle" class="seq">5  ECS RunTask</text><path d="M 938 530 L 1342 530" fill="none" stroke="#24364E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="1140" y="522" text-anchor="middle" class="seq">6  load checkpoint / workspace</text><path d="M 938 595 L 1132 595" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="1035" y="587" text-anchor="middle" class="seq">7  model + tool action</text><path d="M 1132 660 L 938 660" fill="none" stroke="#24364E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="1035" y="652" text-anchor="middle" class="seq">8  approved result</text><path d="M 938 725 L 1342 725" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="1140" y="717" text-anchor="middle" class="seq">9  checkpoint + artifacts</text><path d="M 922 790 L 718 790" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="820" y="782" text-anchor="middle" class="seq">10  signed episode result</text><path d="M 702 855 L 513 855" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="607.5" y="847" text-anchor="middle" class="seq">11  child / wait / complete</text><path d="M 497 920 L 308 920" fill="none" stroke="#24364E" stroke-width="2"  marker-end="url(#arrow)"/>
  <text x="402.5" y="912" text-anchor="middle" class="seq">12  evaluated terminal outcome</text><rect x="250" y="172" width="1180" height="798" rx="20" fill="none" stroke="#79A7FF" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="270" y="1012" class="small">Temporal persists continuity; Fargate exists only during active episodes.</text></svg>