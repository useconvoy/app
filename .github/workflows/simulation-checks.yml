name: simulation-checks

on:
  push:
    branches: [main, v1]
    paths: ["integrations/simulation/**", "control-plane/**", "examples/manipulation/**", ".github/workflows/simulation-checks.yml"]
  pull_request:
    paths: ["integrations/simulation/**", "control-plane/**", "examples/manipulation/**", ".github/workflows/simulation-checks.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MUJOCO_GL: osmesa
    defaults:
      run:
        working-directory: integrations/simulation
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.11"
      - run: uv sync --frozen
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen pytest -q
      - run: uv run --frozen convoy-sim --episodes 3 --require-success --output runs/ci-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-evidence
          path: integrations/simulation/runs/ci-reference
          if-no-files-found: ignore
          retention-days: 7

  managed-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: integrations/simulation
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.11"
      - run: uv sync --frozen --extra managed
      - run: uv run --frozen --extra managed pytest -q tests/test_qualification_pipeline.py tests/test_managed_worker.py tests/test_realtime.py --basetemp=/tmp/convoy-managed-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registered-timing-measurements
          # Only explicit measurement summaries; never enrollment state, keys or journals.
          path: /tmp/convoy-managed-acceptance/*/timing-*.json
          if-no-files-found: ignore
          retention-days: 7
      - run: uv run --frozen --extra managed ruff check src tests ../../examples/manipulation
      - run: uv run --frozen --extra managed python ../../examples/manipulation/pipeline.py --faults --output runs/ci-pipeline
      - run: uv run --frozen --extra managed python ../../examples/manipulation/evaluate.py --output runs/ci-evaluation
      # Do not upload the surrounding directory: it contains generated credentials.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-pipeline-result
          path: |
            integrations/simulation/runs/ci-pipeline/pipeline-result.json
            integrations/simulation/runs/ci-evaluation/evaluation-result.json
          if-no-files-found: ignore
          retention-days: 7
