name: deploy-website

# Releases standalone Next.js plus the API image to the existing Lightsail host.
# Host runtime files under /opt/convoy/portal are provisioned separately and retained.
# vars.DEPLOY_HOST, trusted vars.DEPLOY_HOST_KEY and secrets.DEPLOY_SSH_KEY are required.

on:
  push:
    branches: [main]
    paths: ["control-plane/**", "website/**", "!website/design/**", "!website/**/*.md", ".github/workflows/deploy-website.yml"]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Restore both application services from a host backup; retain runtime data"
        type: boolean
        default: false
      rollback_to:
        description: "Backup to restore (a directory name under /opt/convoy/rollback/, e.g. 20260907T015223Z for the pre-launch console). Empty means the newest."
        type: string
        default: ""

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE: https://deployconvoy.com
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release id
        id: meta
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >>"$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: ${{ !inputs.rollback }}
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: ${{ !inputs.rollback }}
        with:
          node-version: 22

      - name: Build the standalone site
        if: ${{ !inputs.rollback }}
        working-directory: website
        env:
          NEXT_PUBLIC_SITE_URL: https://deployconvoy.com
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run check:tokens
          bash scripts/test-portal.sh
          pnpm run test:platform
          pnpm run test:configurations
          pnpm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar -czf "/tmp/release-${{ steps.meta.outputs.sha }}.tar.gz" -C .next/standalone .
          ls -la "/tmp/release-${{ steps.meta.outputs.sha }}.tar.gz"

      - name: Build the API-only image
        if: ${{ !inputs.rollback }}
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          docker build --tag "convoy-control-plane:${SHA}" control-plane
          docker save "convoy-control-plane:${SHA}" | gzip >"/tmp/control-plane-${SHA}.tar.gz"

      - name: Prepare trusted SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::vars.DEPLOY_HOST is invalid or missing"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "::error::secrets.DEPLOY_SSH_KEY is not set"; exit 1; }
          test -n "${DEPLOY_HOST_KEY}" || { echo "::error::trusted vars.DEPLOY_HOST_KEY is required"; exit 1; }
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${DEPLOY_SSH_KEY}" >~/.ssh/deploy_key
          printf '%s\n' "${DEPLOY_HOST_KEY}" >~/.ssh/known_hosts
          ssh-keygen -F "${DEPLOY_HOST}" -f ~/.ssh/known_hosts >/dev/null || { echo "::error::trusted host key does not match DEPLOY_HOST"; exit 1; }
          printf '%s\n' 'Host convoy-deploy' "  HostName ${DEPLOY_HOST}" '  User ubuntu' '  IdentityFile ~/.ssh/deploy_key' '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  ConnectTimeout 20' '  BatchMode yes' >~/.ssh/config
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts

      - name: Ship and switch both application services
        id: ship
        if: ${{ !inputs.rollback }}
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          scp "/tmp/release-${SHA}.tar.gz" "/tmp/control-plane-${SHA}.tar.gz" \
            website/infra/deploy/remote-release.sh website/infra/deploy/compose-release.py convoy-deploy:/tmp/
          ssh convoy-deploy sudo -n bash /tmp/remote-release.sh deploy "${SHA}" "/tmp/release-${SHA}.tar.gz" "/tmp/control-plane-${SHA}.tar.gz" | tee /tmp/deploy-result.log
          BACKUP=$(sed -nE 's#^backup: /opt/convoy/rollback/([A-Za-z0-9_-]+)$#\1#p' /tmp/deploy-result.log | tail -1)
          test -n "$BACKUP"
          echo "backup=$BACKUP" >>"$GITHUB_OUTPUT"

      - name: Roll back both application services
        if: ${{ inputs.rollback }}
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          [[ "${ROLLBACK_TO}" =~ ^[A-Za-z0-9_-]*$ ]] || { echo "invalid backup name"; exit 1; }
          scp website/infra/deploy/remote-release.sh website/infra/deploy/compose-release.py convoy-deploy:/tmp/
          ssh convoy-deploy sudo -n bash /tmp/remote-release.sh rollback "${ROLLBACK_TO}"

      - name: Verify the public site
        id: verify
        if: ${{ !inputs.rollback }}
        run: |
          set -u
          fail=0
          check() { # label, expected, actual
            if [ "$2" = "$3" ]; then echo "ok   $1: $3"; else echo "FAIL $1: expected $2, got $3"; fail=1; fi
          }
          check "apex https"        200 "$(curl -sS -o /tmp/apex.html -w '%{http_code}' --max-time 20 "$SITE/")"
          check "www https redirects to apex" "308 https://deployconvoy.com/" "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "https://www.deployconvoy.com/")"
          check "http redirects"    308 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "http://deployconvoy.com/")"
          check "www http redirects" 308 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "http://www.deployconvoy.com/")"
          TITLE=$(grep -o '<title>[^<]*</title>' /tmp/apex.html | head -1)
          check "title" "<title>Convoy | AI Model Deployment for Robots</title>" "$TITLE"
          check "hero"   1 "$(grep -c 'Deploy AI models to real robots.' /tmp/apex.html)"
          check "mailto" 1 "$(grep -c 'mailto:founders@deployconvoy.com?subject=' /tmp/apex.html)"
          CSS=$(grep -oE '/_next/static/[^"]+\.css' /tmp/apex.html | head -1)
          check "stylesheet"  200 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$CSS")"
          check "canonical"   1 "$(grep -c '<link rel="canonical" href="https://deployconvoy.com/"/>' /tmp/apex.html)"
          OG=$(grep -o '<meta property="og:image" content="[^"]*"' /tmp/apex.html | sed 's/.*content="//; s/"$//')
          check "og image url" "$SITE/share/" "$(echo "$OG" | grep -o "$SITE/share/")"
          check "og image"    "200 image/png" "$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' --max-time 30 "$OG")"
          check "favicon.ico" 200 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/favicon.ico")"
          ICON=$(grep -o '<link rel="icon" href="/icons/[^"]*-96.png"' /tmp/apex.html | sed 's/.*href="//; s/"$//')
          check "96px icon"   "200 image/png" "$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' --max-time 20 "$SITE$ICON")"
          APPLE=$(grep -o '<link rel="apple-touch-icon" href="[^"]*"' /tmp/apex.html | sed 's/.*href="//; s/"$//')
          check "apple icon"  200 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$APPLE")"
          check "manifest"    200 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/manifest.webmanifest")"
          check "json-ld"     1 "$(grep -c 'application/ld+json' /tmp/apex.html)"
          check "robots.txt"  200 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/robots.txt")"
          check "legacy path" 308 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/platform")"
          check "legacy portal redirect" "308 /app/configurations" "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$SITE/portal/" | sed "s#${SITE}##")"
          check "portal session" 200 "$(curl -sS -o /tmp/portal-session.json -w '%{http_code}' --max-time 20 "$SITE/api/portal/session")"
          check "anonymous snapshot protected" 401 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/api/portal/snapshot")"
          check "workspace entry" "307 /app/projects" "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$SITE/app" | sed "s#${SITE}##")"
          check "configurations" 200 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/app/configurations")"
          check "robot applications" "308 /app/configurations" "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$SITE/app/applications" | sed "s#${SITE}##")"
          check "legacy device redirect" "308 /app/configurations" "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$SITE/app/device" | sed "s#${SITE}##")"
          check "device chat deep link" "308 /app/configurations?view=chat" "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$SITE/app/device?view=chat" | sed "s#${SITE}##")"
          check "integrated device section" "308 /app/configurations?section=device&view=device" "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$SITE/app/applications?section=device&view=device" | sed "s#${SITE}##")"
          check "legacy console redirect" "308 /app/configurations" "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$SITE/console" | sed "s#${SITE}##")"
          check "anonymous management protected" 401 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/api/platform/auth/me")"
          check "anonymous workspace documents protected" 401 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/api/platform/workspace-documents/configurations")"
          check "anonymous offline evaluations protected" 401 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/api/platform/offline-evaluations")"
          check "anonymous device chat protected" 401 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/api/platform/chat/devices")"
          check "sitemap"     200 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/sitemap.xml")"
          echo "certificate: $(echo | openssl s_client -connect deployconvoy.com:443 -servername deployconvoy.com 2>/dev/null | openssl x509 -noout -issuer -enddate | tr '\n' ' ')"
          {
            echo "## deploy-website"
            echo "- release: \`${{ steps.meta.outputs.sha }}\` (rollback=${{ inputs.rollback }})"
            echo "- title: $TITLE"
            echo "- verification: $([ $fail = 0 ] && echo passed || echo FAILED)"
          } >>"$GITHUB_STEP_SUMMARY"
          exit $fail

      - name: Verify rollback public reachability
        if: ${{ inputs.rollback }}
        run: curl --fail --silent --show-error --max-time 20 --output /dev/null "$SITE/"

      - name: Restore both services if public verification fails
        if: ${{ failure() && steps.ship.outcome == 'success' && steps.verify.outcome == 'failure' }}
        env:
          BACKUP: ${{ steps.ship.outputs.backup }}
        run: |
          [[ "$BACKUP" =~ ^[A-Za-z0-9_-]+$ ]] || exit 1
          ssh convoy-deploy sudo -n bash /tmp/remote-release.sh rollback "$BACKUP"
