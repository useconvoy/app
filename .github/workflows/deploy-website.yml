name: deploy-website

# Releases the landing page to the existing Lightsail instance. The build
# happens on a standard Linux runner; the instance receives one tarball of
# the standalone Next.js output and runs it with the stock node:22-alpine
# image already reachable from Docker Hub. No image registry push, no
# snapshot, no new AWS resource: the only things that change on the box are
# compose.yaml's `web` service and a new directory under /opt/convoy/releases.
# Every changed file is copied to /opt/convoy/rollback/<timestamp>/ first.
#
# Repository settings this uses (unchanged from the previous console deploy):
#   vars.DEPLOY_HOST        the instance's static IP
#   vars.DEPLOY_HOST_KEY    ssh-keyscan line for that host (recommended)
#   secrets.DEPLOY_SSH_KEY  private key for ubuntu@ on the instance

on:
  push:
    branches: [main]
    paths: ["website/**", "!website/design/**", "!website/**/*.md", ".github/workflows/deploy-website.yml"]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Restore the previous web release from the newest backup on the instance instead of deploying"
        type: boolean
        default: false

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://deployconvoy.com
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release id
        id: meta
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >>"$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: ${{ !inputs.rollback }}
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: ${{ !inputs.rollback }}
        with:
          node-version: 22

      - name: Build the standalone site
        if: ${{ !inputs.rollback }}
        working-directory: website
        env:
          NEXT_PUBLIC_SITE_URL: https://deployconvoy.com
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint
          pnpm run check:tokens
          pnpm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar -czf "/tmp/release-${{ steps.meta.outputs.sha }}.tar.gz" -C .next/standalone .
          ls -la "/tmp/release-${{ steps.meta.outputs.sha }}.tar.gz"

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          test -n "${DEPLOY_HOST}" || { echo "::error::vars.DEPLOY_HOST is not set"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "::error::secrets.DEPLOY_SSH_KEY is not set"; exit 1; }
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${DEPLOY_SSH_KEY}" >~/.ssh/deploy_key
          if [ -n "${DEPLOY_HOST_KEY}" ]; then
            printf '%s\n' "${DEPLOY_HOST_KEY}" >~/.ssh/known_hosts
            STRICT=yes
          else
            echo "::warning::vars.DEPLOY_HOST_KEY is unset; accepting the host key unverified. Set it to the output of: ssh-keyscan ${DEPLOY_HOST}"
            STRICT=accept-new
          fi
          echo "STRICT=${STRICT}" >>"$GITHUB_ENV"
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=${STRICT} -o ConnectTimeout=20 ubuntu@${DEPLOY_HOST}" >>"$GITHUB_ENV"

      - name: Ship the release and switch the web service
        if: ${{ !inputs.rollback }}
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking="${STRICT}" \
            "/tmp/release-${SHA}.tar.gz" website/infra/deploy/remote-release.sh \
            "ubuntu@${DEPLOY_HOST}:/tmp/"
          $SSH sudo -n bash /tmp/remote-release.sh deploy "${SHA}" "/tmp/release-${SHA}.tar.gz"

      - name: Roll back to the previous web release
        if: ${{ inputs.rollback }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking="${STRICT}" \
            website/infra/deploy/remote-release.sh "ubuntu@${{ vars.DEPLOY_HOST }}:/tmp/"
          $SSH sudo -n bash /tmp/remote-release.sh rollback

      - name: Verify the public site
        run: |
          set -u
          fail=0
          check() { # label, expected, actual
            if [ "$2" = "$3" ]; then echo "ok   $1: $3"; else echo "FAIL $1: expected $2, got $3"; fail=1; fi
          }
          check "apex https"        200 "$(curl -sS -o /tmp/apex.html -w '%{http_code}' --max-time 20 "$SITE/")"
          check "www https"         200 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://www.deployconvoy.com/")"
          check "http redirects"    308 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "http://deployconvoy.com/")"
          check "www http redirects" 308 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "http://www.deployconvoy.com/")"
          TITLE=$(grep -o '<title>[^<]*</title>' /tmp/apex.html | head -1)
          check "title" "<title>Convoy | AI Model Deployment for Robots</title>" "$TITLE"
          check "hero"   1 "$(grep -c 'Deploy AI models to real robots.' /tmp/apex.html)"
          check "mailto" 1 "$(grep -c 'mailto:aws@deployconvoy.com?subject=' /tmp/apex.html)"
          CSS=$(grep -oE '/_next/static/[^"]+\.css' /tmp/apex.html | head -1)
          check "stylesheet"  200 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$CSS")"
          check "og image"    200 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE/opengraph-image")"
          check "legacy path" 308 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/platform")"
          check "old console" 404 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/app")"
          check "sitemap"     200 "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE/sitemap.xml")"
          echo "certificate: $(echo | openssl s_client -connect deployconvoy.com:443 -servername deployconvoy.com 2>/dev/null | openssl x509 -noout -issuer -enddate | tr '\n' ' ')"
          {
            echo "## deploy-website"
            echo "- release: \`${{ steps.meta.outputs.sha }}\` (rollback=${{ inputs.rollback }})"
            echo "- title: $TITLE"
            echo "- verification: $([ $fail = 0 ] && echo passed || echo FAILED)"
          } >>"$GITHUB_STEP_SUMMARY"
          exit $fail
