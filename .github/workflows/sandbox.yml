name: connector-sandbox

on:
  push:
    branches: [main]
    paths:
      - "sandbox/**"
      - "environments/convoy_environments/connectors/**"
      - ".github/workflows/sandbox.yml"
  pull_request:
    paths:
      - "sandbox/**"
      - "environments/convoy_environments/connectors/**"
      - ".github/workflows/sandbox.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install ./core ./environments
      - run: npm test
        working-directory: sandbox
