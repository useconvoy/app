# Development only. PostgreSQL is exposed on loopback and survives container restarts.
services:
  postgres:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: convoy
      POSTGRES_PASSWORD: convoy-local-only
      POSTGRES_DB: convoy_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convoy -d convoy_dev"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  postgres-data:
