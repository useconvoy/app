<!-- @dsCard group="Landing page" viewport="1440x1200" name="Component state board" subtitle="Paired desktop / mobile specimens with closed, open, focus, hover, pressed, current and long-label states" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convoy — component state board</title>
<link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><link rel="stylesheet" href="landing.css">
<style>
body{padding:32px;background:var(--color-surface-subtle)}
.bd{display:flex;flex-direction:column;gap:48px;max-width:1376px;margin:0 auto}
.bd h2{font-size:var(--text-h3-size);line-height:var(--text-h3-line);font-weight:500;margin:0 0 4px}
.bd .meta{font-family:var(--font-mono);font-size:14px;color:var(--color-text-secondary);margin:0 0 16px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:24px;align-items:start}
.frame.m{width:390px;max-width:100%}
.frame{background:var(--color-bg);border:1px solid var(--color-border-strong);border-radius:6px;overflow:hidden;position:relative;min-width:0}
.frame>.lab{position:absolute;right:8px;top:6px;font-family:var(--font-mono);font-size:12px;color:var(--color-text-secondary);background:var(--color-surface);padding:2px 6px;border-radius:2px;z-index:40}
.frame .inner{padding:var(--layout-page-padding) 0}
.frame.m{--layout-page-padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.st{font-family:var(--font-mono);font-size:12px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.04em;padding:0 var(--layout-page-padding)}
.cv-header{position:relative}
@media (max-width:1000px){.pair{grid-template-columns:1fr}.frame.m{justify-self:start}}
</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, ActionGroup, SiteHeader, SiteFooter, SkipLink, SectionHeading, DependencyRows, WorkflowSteps, Disclosure, ReleaseEnvelope, ReleaseComposition, ExecutionPath, PartnershipPanel, ContactEmailPanel } = window.ConvoyDesignSystem_29acff;
const NAV=[{label:"How it works",href:"#how"},{label:"Design partnership",href:"#partners"},{label:"Contact",href:"#contact"}];
const LONG=[{label:"How the release workflow works",href:"#how"},{label:"Design partnership programme",href:"#partners"},{label:"Contact and next steps",href:"#contact"}];
const CTA={label:"Discuss your deployment",href:"#contact"};
const Pair=({title,meta,desk,mob})=>(<section><h2>{title}</h2><p className="meta">{meta}</p><div className="pair"><div className="frame"><span className="lab">desktop ≥900</span>{desk}</div><div className="frame m cv-viewport-md cv-viewport-sm"><span className="lab">mobile 390</span>{mob}</div></div></section>);
const Focus=({children})=>{const r=React.useRef();React.useEffect(()=>{const el=r.current&&r.current.querySelector('[data-focus]');if(el){el.classList.add('is-focus');}},[]);return <div ref={r}>{children}</div>};
const rows=[{term:"Inputs",body:"Images, sensor data, and robot state prepared the way the model expects."},{term:"Actions",body:"Model outputs translated into the units, coordinates, and commands the controller understands."},{term:"Execution",body:"The runtime, dependencies, hardware settings, and timing required by the deployment."},{term:"Release evidence",body:"A record of the configuration, conditions, and checks used to evaluate the system."}];
const steps=[{title:"Package",body:"Bring the model, input and action processing, runtime dependencies, and target configuration together."},{title:"Qualify",body:"Check that release against defined task and runtime criteria. Keep the conditions and results connected to the configuration that was tested."},{title:"Release",body:"Carry the identified configuration into deployment, with a clear basis for observing behavior and managing subsequent changes."}];
function Board(){
  React.useEffect(()=>{document.querySelectorAll('[data-autofocus]').forEach(el=>{el.style.outline='2px solid var(--color-focus)';el.style.outlineOffset='3px';});},[]);
  return (<div className="bd">
    <Pair title="Header" meta="closed · open · link-selected · long labels · toggle focus/expanded" desk={<div className="stack"><SiteHeader sticky={false} links={NAV} cta={CTA} current="#how" id="m1"/><SiteHeader sticky={false} links={LONG} cta={CTA} id="m2"/></div>} mob={<div className="stack"><SiteHeader sticky={false} links={NAV} cta={CTA} id="m3"/><div className="st">open · current link · Escape returns focus to toggle</div><div style={{position:"relative",minHeight:340}}><SiteHeader sticky={false} links={NAV} cta={CTA} current="#partners" defaultOpen id="m4"/></div><div className="st">long labels</div><SiteHeader sticky={false} links={LONG} cta={CTA} id="m5"/></div>} />
    <Pair title="Actions and links" meta="default · hover (linen/deep oxide) · pressed · keyboard focus · 48px targets" desk={<div className="inner" style={{padding:"32px",display:"flex",flexDirection:"column",gap:24}}><ActionGroup><Button arrow href="#contact">Discuss your deployment</Button><Button variant="secondary" href="#how">Explore the workflow</Button></ActionGroup><ActionGroup><Button className="is-pressed" arrow>Pressed</Button><Button variant="secondary" data-autofocus>Keyboard focus</Button><Button variant="text">Text action</Button><a href="#x">Destination link</a></ActionGroup></div>} mob={<div style={{padding:"24px 20px",display:"flex",flexDirection:"column",gap:24}}><ActionGroup><Button arrow href="#contact">Discuss your deployment</Button><Button variant="secondary" href="#how">Explore the workflow</Button></ActionGroup><ActionGroup><Button variant="secondary" data-autofocus>Keyboard focus</Button><a href="#x" style={{display:"inline-flex",minHeight:48,alignItems:"center"}}>Destination link</a></ActionGroup></div>} />
    <Pair title="Hero" meta="desktop split ≥1200 (copy left, vertical composition right, top-aligned) · ≤1200 and mobile single column, copy and CTAs before the diagram" desk={<div style={{padding:"48px 40px"}}><div className="lp-hero__grid"><div className="lp-hero__copy"><p className="cv-eyebrow">Deployment infrastructure for physical AI</p><h1 className="cv-h1" style={{fontSize:52}}>Deploy AI models to real robots.</h1><p className="cv-lead">Convoy is building the runtime and release workflow that connects trained models to robot sensors, compute, and controllers, starting with learned manipulation.</p><ActionGroup><Button arrow href="#contact">Discuss your deployment</Button><Button variant="secondary" href="#how">Explore the workflow</Button></ActionGroup><p className="cv-small lp-hero__invite">Help shape the next robot deployment workflow.</p></div><div className="lp-hero__figure"><ReleaseComposition orientation="vertical"/></div></div></div>} mob={<div style={{padding:"32px 20px"}}><div className="lp-hero__copy"><p className="cv-eyebrow">Deployment infrastructure for physical AI</p><h1 className="cv-h1">Deploy AI models to real robots.</h1><p className="cv-lead">Convoy is building the runtime and release workflow that connects trained models to robot sensors, compute, and controllers, starting with learned manipulation.</p><ActionGroup><Button arrow href="#contact">Discuss your deployment</Button><Button variant="secondary" href="#how">Explore the workflow</Button></ActionGroup><p className="cv-small lp-hero__invite">Help shape the next robot deployment workflow.</p></div><div style={{marginTop:32}}><ReleaseComposition orientation="vertical"/></div></div>} />
    <Pair title="Release composition + envelope" meta="horizontal composition (full-width figures only) · vertical stack as used in the hero; labels 16px, metadata 14px at both sizes" desk={<div style={{padding:32}}><ReleaseComposition orientation="horizontal"/></div>} mob={<div style={{padding:"24px 20px"}}><ReleaseEnvelope title="The robot-policy release"/></div>} />
    <Pair title="Execution path" meta="horizontal · vertical, same order; Convoy runtime boundary is a labelled group in both; optional trace and reduced-motion complete state" desk={<div style={{padding:32}}><ExecutionPath traceable/></div>} mob={<div style={{padding:"24px 20px"}}><ExecutionPath/></div>} />
    <Pair title="Dependency rows + workflow sequence" meta="aligned rows / three stages · ordered mobile stack" desk={<div style={{padding:32,display:"flex",flexDirection:"column",gap:48}}><DependencyRows columns={["","What the deployment must carry"]} rows={rows}/><WorkflowSteps steps={steps}/></div>} mob={<div style={{padding:"24px 20px",display:"flex",flexDirection:"column",gap:40}}><DependencyRows columns={["","What the deployment must carry"]} rows={rows}/><WorkflowSteps steps={steps}/></div>} />
    <Pair title="Partnership panel + contact email panel" meta="7/5 composition · single column; selectable address, mailto with subject, no form" desk={<div style={{padding:32,display:"flex",flexDirection:"column",gap:32}}><PartnershipPanel id="p1" title="Start with one model. One robot configuration. One clear deployment goal." lead="Each partnership starts with a defined model, robot configuration, and deployment goal." actions={<Button arrow href="#contact">Discuss your deployment</Button>} fit={[{label:"A good fit",body:"A trained manipulation policy you want running on hardware you already have."},{label:"Not yet",body:"Fleet-wide rollout across many robot types, or training a model from scratch."}]}/><ContactEmailPanel/></div>} mob={<div style={{padding:"24px 20px",display:"flex",flexDirection:"column",gap:24}}><PartnershipPanel id="p2" title="Start with one model. One robot configuration. One clear deployment goal." lead="Each partnership starts with a defined model, robot configuration, and deployment goal." actions={<Button arrow href="#contact">Discuss your deployment</Button>} fit={[{label:"A good fit",body:"A trained manipulation policy you want running on hardware you already have."}]}/><ContactEmailPanel/></div>} />
    <Pair title="Questions (disclosure)" meta="collapsed · expanded · focused summary · long answer; several may stay open" desk={<div style={{padding:32}}><Disclosure summary="Is Convoy a robot maker?">No. Convoy does not build robots or robot hardware. We’re building deployment infrastructure for models that run on robots you already have, working with the robot’s existing controller.</Disclosure><Disclosure summary="Is the cloud required?" open>No. Where input processing and the model run is part of the target configuration: on the robot, at the site, or in the cloud. Execution placement depends on the task’s compute, timing, and failure requirements.</Disclosure><Disclosure summary="Is this available today?" open>Convoy is in development. We’re speaking with robotics teams about focused design partnerships, with compatibility and scope defined around each deployment.</Disclosure></div>} mob={<div style={{padding:"24px 20px"}}><Disclosure summary="Does Convoy replace the robot controller or safety system?">No. The controller and safety system remain with the robot maker or integrator.</Disclosure><Disclosure summary="Is this available today?" open>Convoy is in development. We’re speaking with robotics teams about focused design partnerships, with compatibility and scope defined around each deployment.</Disclosure></div>} />
    <Pair title="Footer" meta="wordmark · description · footer nav · legal row with domain link" desk={<SiteFooter links={NAV}/>} mob={<SiteFooter links={NAV}/>} />
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Board/>);
</script></body></html>
