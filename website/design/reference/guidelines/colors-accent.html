<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Accent</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.sw{display:grid;gap:12px}.sw--row{grid-auto-flow:column;grid-auto-columns:1fr}.chip{display:flex;flex-direction:column;gap:6px;min-width:0}.chip i{display:block;height:56px;border-radius:var(--radius);border:1px solid rgba(24,34,31,.08)}.chip b{font-weight:500;font-size:13px}.chip code{font-size:11px;color:var(--color-text-muted)}.demo{display:flex;gap:12px;align-items:center;margin-top:16px}</style></head><body><div class="sw sw--row"><div class="chip"><i style="background:var(--color-accent)"></i><b>Accent</b><code>--color-accent · #A63D22</code></div><div class="chip"><i style="background:var(--color-accent-hover)"></i><b>Accent hover</b><code>--color-accent-hover · #852F19</code></div><div class="chip"><i style="background:var(--color-accent-tint)"></i><b>Accent tint</b><code>--color-accent-tint · #F9E9E1</code></div><div class="chip"><i style="background:var(--color-accent-tint);display:flex;align-items:center;justify-content:center;color:var(--color-accent);font-weight:500">Aa on tint</i><b>Contrast</b><code>oxide on tint 5.6:1 · white on oxide 6.6:1</code></div></div></body></html>
