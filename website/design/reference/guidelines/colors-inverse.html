<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Inverse</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.sw{display:grid;gap:12px}.sw--row{grid-auto-flow:column;grid-auto-columns:1fr}.chip{display:flex;flex-direction:column;gap:6px;min-width:0}.chip i{display:block;height:56px;border-radius:var(--radius);border:1px solid rgba(24,34,31,.08)}.chip b{font-weight:500;font-size:13px}.chip code{font-size:11px;color:var(--color-text-muted)}body{background:var(--color-surface-inverse);color:var(--color-text-inverse)}.chip b{color:var(--color-text-inverse)}.chip code{color:var(--color-text-inverse-muted)}.chip i{border-color:rgba(255,255,255,.12)}</style></head><body><div class="sw sw--row"><div class="chip"><i style="background:var(--color-text-inverse)"></i><b>Inverse text</b><code>--color-text-inverse · #F3F5F0</code></div><div class="chip"><i style="background:var(--color-text-inverse-muted)"></i><b>Inverse muted</b><code>--color-text-inverse-muted · #BAC6BC</code></div><div class="chip"><i style="background:var(--cv-code-keyword)"></i><b>Code keyword</b><code>--cv-code-keyword · #F4B897</code></div><div class="chip"><i style="background:var(--cv-code-string)"></i><b>Code string</b><code>--cv-code-string · #B7D8B8</code></div><div class="chip"><i style="background:var(--cv-code-value)"></i><b>Code value</b><code>--cv-code-value · #ABCDED</code></div></div></body></html>
