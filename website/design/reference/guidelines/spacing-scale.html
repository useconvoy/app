<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.sw{display:grid;gap:12px}.sw--row{grid-auto-flow:column;grid-auto-columns:1fr}.chip{display:flex;flex-direction:column;gap:6px;min-width:0}.chip i{display:block;height:56px;border-radius:var(--radius);border:1px solid rgba(24,34,31,.08)}.chip b{font-weight:500;font-size:13px}.chip code{font-size:11px;color:var(--color-text-muted)}.sp{display:flex;align-items:flex-end;gap:12px}.sp div{display:flex;flex-direction:column;align-items:center;gap:6px}.sp i{display:block;width:100%;background:var(--color-accent-tint);border:1px solid var(--color-accent)}.sp code{font-size:11px;color:var(--color-text-muted)}</style></head><body>
<div class="sp"><div style="flex:4"><i style="height:4px"></i><code>4</code></div><div style="flex:8"><i style="height:8px"></i><code>8</code></div><div style="flex:12"><i style="height:12px"></i><code>12</code></div><div style="flex:16"><i style="height:16px"></i><code>16</code></div><div style="flex:24"><i style="height:24px"></i><code>24</code></div><div style="flex:32"><i style="height:32px"></i><code>32</code></div><div style="flex:48"><i style="height:48px"></i><code>48</code></div><div style="flex:64"><i style="height:64px"></i><code>64</code></div><div style="flex:80"><i style="height:80px"></i><code>80</code></div><div style="flex:112"><i style="height:80px"></i><code>112</code></div></div>
<p style="margin-top:12px;font-size:13px;color:var(--color-text-muted)"><code>--space-4</code> … <code>--space-144</code>. Inside components use 4–24; between blocks 32–64; between sections 112 / 72 / 56.</p></body></html>
