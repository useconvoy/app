<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Text</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.sw{display:grid;gap:12px}.sw--row{grid-auto-flow:column;grid-auto-columns:1fr}.chip{display:flex;flex-direction:column;gap:6px;min-width:0}.chip i{display:block;height:56px;border-radius:var(--radius);border:1px solid rgba(24,34,31,.08)}.chip b{font-weight:500;font-size:13px}.chip code{font-size:11px;color:var(--color-text-muted)}</style></head><body><div class="sw sw--row"><div class="chip"><i style="background:var(--color-text)"></i><b>Text</b><code>--color-text · #18221F</code></div><div class="chip"><i style="background:var(--color-text-secondary)"></i><b>Secondary</b><code>--color-text-secondary · #45534D</code></div><div class="chip"><i style="background:var(--color-text-muted)"></i><b>Muted</b><code>--color-text-muted · #647168</code></div><div class="chip"><i style="background:var(--color-border)"></i><b>Border</b><code>--color-border · #D3D8D1</code></div><div class="chip"><i style="background:var(--color-border-strong)"></i><b>Border strong</b><code>--color-border-strong · #78867D</code></div></div></body></html>
