<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.sw{display:grid;gap:12px}.sw--row{grid-auto-flow:column;grid-auto-columns:1fr}.chip{display:flex;flex-direction:column;gap:6px;min-width:0}.chip i{display:block;height:56px;border-radius:var(--radius);border:1px solid rgba(24,34,31,.08)}.chip b{font-weight:500;font-size:13px}.chip code{font-size:11px;color:var(--color-text-muted)}</style></head><body><div class="sw sw--row"><div class="chip"><i style="background:var(--color-bg)"></i><b>Background</b><code>--color-bg · #F6F4EF</code></div><div class="chip"><i style="background:var(--color-surface)"></i><b>Surface</b><code>--color-surface · #FFFFFF</code></div><div class="chip"><i style="background:var(--color-surface-subtle)"></i><b>Surface subtle</b><code>--color-surface-subtle · #ECE9E1</code></div><div class="chip"><i style="background:var(--color-surface-inverse)"></i><b>Inverse surface</b><code>--color-surface-inverse · #16201C</code></div></div></body></html>
