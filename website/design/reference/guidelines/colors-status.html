<!-- @dsCard group="Colors" viewport="700x200" name="Status" subtitle="Success, warning, error, info — each a deep ink on a pale tint" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.sw{display:grid;gap:12px}.sw--row{grid-auto-flow:column;grid-auto-columns:1fr}.chip{display:flex;flex-direction:column;gap:6px;min-width:0}.chip i{display:block;height:56px;border-radius:var(--radius);border:1px solid rgba(24,34,31,.08)}.chip b{font-weight:500;font-size:13px}.chip code{font-size:11px;color:var(--color-text-muted)}.st{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.st div{border-radius:var(--radius);padding:14px 16px;font-weight:500}.st code{display:block;font-size:11px;font-weight:400;margin-top:6px;opacity:.85}</style></head><body><div class="st">
<div style="background:var(--color-success-bg);color:var(--color-success)">Success<code>#21633F / #E5F1E8</code><code>--color-success(-bg)</code></div>
<div style="background:var(--color-warning-bg);color:var(--color-warning)">Warning<code>#775100 / #FFF1C8</code><code>--color-warning(-bg)</code></div>
<div style="background:var(--color-error-bg);color:var(--color-error)">Error<code>#A72F32 / #FCE9E9</code><code>--color-error(-bg)</code></div>
<div style="background:var(--color-info-bg);color:var(--color-info)">Info<code>#265B94 / #E7EFF9</code><code>--color-info(-bg)</code></div></div>
<p style="margin-top:14px;color:var(--color-text-secondary);font-size:13px">Status colours label facts in product UI. They never decorate, and no status badge appears on the public landing page.</p></body></html>
