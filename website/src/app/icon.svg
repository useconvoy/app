<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Convoy Labs">
  <!-- The square lockup: the route mark on a deep tile. Because the tile is
       dark and the mark is paper, this reads on both light and dark browser
       chrome and needs no prefers-color-scheme variant. -->
  <rect width="64" height="64" rx="14" fill="#153B2E"/>
  <g transform="translate(12 25)">
    <line x1="1" y1="7" x2="39" y2="7" stroke="#F2F5EF" stroke-width="2.7"/>
    <circle cx="5" cy="7" r="4.6" fill="#F2F5EF"/>
    <circle cx="20" cy="7" r="4.6" fill="#153B2E" stroke="#F2F5EF" stroke-width="2.7"/>
    <circle cx="35" cy="7" r="4.6" fill="#153B2E" stroke="#F2F5EF" stroke-width="2.7"/>
  </g>
</svg>
