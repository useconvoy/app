<!doctype html>
<!-- Link-preview card (1200 × 630): an oxide color block. One flush-left
     column on an 80 px margin holds the brand lockup (the mark at 60 px, the
     wordmark at 48 px), the two-line headline in Plex Sans 500 at 86 px with
     normal tracking, and a subordinate domain line; the right third carries
     the open release frame (the C) as a bold cream stroke at low opacity,
     right-aligned on the 80 px margin and kept clear of the words. Rendered
     to public/share/ by scripts/build-brand.mjs with the self-hosted IBM
     Plex Sans and Mono faces. Colors are the design tokens: oxide, paper.
     Selected by Codex review from two candidates (2026-09). -->
<html lang="en"><head><meta charset="utf-8"><style>
  @font-face { font-family: "Plex Sans"; font-weight: 600; src: url("__FONTS__/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Plex Sans"; font-weight: 500; src: url("__FONTS__/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Plex Mono"; font-weight: 400; src: url("__FONTS__/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #A63D22; -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; color: #F6F4EF; font-family: "Plex Sans", sans-serif; overflow: hidden; }
  .field { position: absolute; left: 760px; top: 0; width: 440px; height: 630px; }
  /* 520 px frame; its open ends (path x = 44/64) land at 1120, the 80 px right margin. */
  .frame { position: absolute; left: 2px; top: 55px; width: 520px; height: 520px; opacity: 0.24; }
  .brand { position: absolute; left: 80px; top: 80px; display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 60px; height: 60px; display: block; }
  .brand span { font-weight: 600; font-size: 48px; letter-spacing: -0.02em; line-height: 1; }
  /* 86 px with normal tracking: "Deploy AI models" fits one line in 720 px and stays 70+ px clear of the frame stroke. */
  .h1 { position: absolute; left: 80px; top: 228px; width: 720px; font-size: 86px; line-height: 1.04; letter-spacing: 0; font-weight: 500; }
  .dom { position: absolute; left: 80px; top: 528px; font-family: "Plex Mono", monospace; font-size: 22px; letter-spacing: 0.02em; color: #F6F4EF; opacity: 0.86; }
</style></head><body>
<div class="card">
  <div class="field" data-art="field">
    <svg class="frame" viewBox="0 0 64 64" aria-hidden="true"><path d="M44 16H22a6 6 0 0 0-6 6v20a6 6 0 0 0 6 6h22" fill="none" stroke="#F6F4EF" stroke-width="9" stroke-linecap="square" stroke-linejoin="round"/></svg>
  </div>
  <div class="brand" data-text="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#F6F4EF"/><path d="M44 16H22a6 6 0 0 0-6 6v20a6 6 0 0 0 6 6h22" fill="none" stroke="#A63D22" stroke-width="9" stroke-linecap="square" stroke-linejoin="round"/></svg>
    <span>Convoy</span>
  </div>
  <h1 class="h1" data-text="headline">Deploy AI models<br>to real robots.</h1>
  <p class="dom" data-text="domain">deployconvoy.com</p>
</div>
</body></html>
