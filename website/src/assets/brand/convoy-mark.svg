<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Convoy mark, finalized in Claude Design: an open release frame read as
       a bold geometric C, paper (#F6F4EF, the background token) on oxide
       (#A63D22, the accent token). The same geometry is used at every icon
       size; the stroke's visible bounds run roughly x 11.5–48.5 / y 11.5–52.5,
       so the mark is not padded for maskable use and is not declared as such.
       An icon cannot read CSS variables, so the two values are copied from
       tokens.css. -->
  <rect width="64" height="64" rx="14" fill="#A63D22"/>
  <path d="M44 16H22a6 6 0 0 0-6 6v20a6 6 0 0 0 6 6h22" fill="none" stroke="#F6F4EF" stroke-width="9" stroke-linecap="square" stroke-linejoin="round"/>
</svg>
